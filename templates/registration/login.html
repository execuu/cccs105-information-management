{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
  <section class="mx-auto max-w-md rounded-lg border border-line bg-white p-6 shadow-sm">
    <h1 class="text-2xl font-semibold">Sign In</h1>
    <p class="mt-1 text-sm text-muted">Use your admin or instructor account.</p>
    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}
      {% if form.non_field_errors %}
        <div class="rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800">{{ form.non_field_errors }}</div>
      {% endif %}
      <div>
        <label class="text-sm font-medium" for="{{ form.username.id_for_label }}">Username</label>
        {{ form.username }}
      </div>
      <div>
        <label class="text-sm font-medium" for="{{ form.password.id_for_label }}">Password</label>
        {{ form.password }}
      </div>
      <button type="submit" class="w-full rounded-md bg-accent px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">Login</button>
    </form>
  </section>
{% endblock %}
